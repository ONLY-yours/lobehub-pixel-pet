name: Release

# Push a tag like v0.1.0 to build the macOS app and attach it to a GitHub Release.
# "Run workflow" (workflow_dispatch) builds without releasing and keeps the files as a run artifact.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1' # unit tests do not start Electron
      - run: npm test

  build-mac:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build universal macOS app (Intel + Apple Silicon)
        run: npm run dist:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false' # unsigned build, see README
      - name: Show what was built
        run: |
          ls -la dist
          APP="dist/mac-universal/Pixel Pet.app"
          lipo -archs "$APP/Contents/MacOS/Pixel Pet"
          codesign -dv "$APP" 2>&1 | head -5 || true
      - uses: actions/upload-artifact@v4
        with:
          name: pixel-pet-mac
          path: |
            dist/*.dmg
            dist/*.zip
          if-no-files-found: error

  build-win:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build Windows app (x64 installer + zip)
        run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false' # unsigned build, see README
      - name: Show what was built
        shell: pwsh
        run: |
          Get-ChildItem dist | Select-Object Name, Length | Format-Table -AutoSize
          Get-ChildItem dist/win-unpacked -Name | Select-Object -First 12
      - uses: actions/upload-artifact@v4
        with:
          name: pixel-pet-win
          path: |
            dist/*.exe
            dist/*.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-mac, build-win]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: pixel-pet-*
          merge-multiple: true
          path: dist
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la dist
          cat > notes.md <<'NOTES'
          ## 安装（macOS，Intel 与 Apple 芯片通用）

          1. 下载 `.dmg`（或 `.zip`），把 **Pixel Pet** 拖进“应用程序”。
          2. 应用没有苹果开发者签名，首次打开会被拦截：右键点应用选“打开”，或执行 `xattr -cr "/Applications/Pixel Pet.app"`。
          3. 先装 LobeHub CLI：`npm install -g @lobehub/cli`，宠物的大脑通过它运行。

          ## 安装（Windows 10/11，x64）

          1. 下载 `-win-x64-setup.exe` 运行安装（或下载 `-win-x64.zip` 解压后直接运行 `Pixel Pet.exe`）。
          2. 应用没有代码签名，Windows SmartScreen 会拦：点“更多信息” → “仍要运行”。
          3. 先装 Node.js 和 LobeHub CLI：`npm install -g @lobehub/cli`（装好后在终端能执行 `lh --version`）。
          4. Windows 版目前只做了构建，没有在真机上完整验证，遇到问题请开 issue。

          ## 使用这台电脑（默认勾选，注意权限）

          孵化页的“使用这台电脑”默认开启：宠物通过 Responses API 调用应用提供的本机工具，不再启动 `lh connect`。本机工具可以读写文件和运行命令，**权限等同你的账号，不是沙盒**；把文件拖给它时只传路径。不想要的话，孵化时取消勾选，或在“⋯”菜单里随时关闭。图片会发送到 Responses API。

          ## 素材说明

          “大肥鱼”的动画来自开源项目 [dsh-pet](https://github.com/PC2005-cloud/dsh-pet)：素材仅限非商业使用，形象为社区二创（非 DeepSeek 官方），授权 CC BY-NC-SA 4.0。详见 README 的 Credits。请勿商用。

          ---
          NOTES
          gh release create "${{ github.ref_name }}" dist/* \
            --repo "${{ github.repository }}" \
            --title "Pixel Pet ${{ github.ref_name }}" \
            --notes-file notes.md \
            --generate-notes
