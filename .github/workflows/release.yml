name: Release

# Push a tag like v0.1.0 to build the macOS app and attach it to a GitHub Release.
# "Run workflow" (workflow_dispatch) builds without releasing and keeps the files as a run artifact.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1' # unit tests do not start Electron
      - run: npm test

  build-mac:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build universal macOS app (Intel + Apple Silicon)
        run: npm run dist:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false' # unsigned build, see README
      - name: Show what was built
        run: |
          ls -la dist
          APP="dist/mac-universal/Pixel Pet.app"
          lipo -archs "$APP/Contents/MacOS/Pixel Pet"
          codesign -dv "$APP" 2>&1 | head -5 || true
      - uses: actions/upload-artifact@v4
        with:
          name: pixel-pet-mac
          path: |
            dist/*.dmg
            dist/*.zip
          if-no-files-found: error
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" dist/*.dmg dist/*.zip \
            --title "Pixel Pet ${{ github.ref_name }}" \
            --generate-notes
