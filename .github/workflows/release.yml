name: Release

# Push a tag like v0.1.0 to build the macOS app and attach it to a GitHub Release.
# "Run workflow" (workflow_dispatch) builds without releasing and keeps the files as a run artifact.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1' # unit tests do not start Electron
      - run: npm test

  build-mac:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build universal macOS app (Intel + Apple Silicon)
        run: npm run dist:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false' # unsigned build, see README
      - name: Show what was built
        run: |
          ls -la dist
          APP="dist/mac-universal/Pixel Pet.app"
          lipo -archs "$APP/Contents/MacOS/Pixel Pet"
          codesign -dv "$APP" 2>&1 | head -5 || true
      - uses: actions/upload-artifact@v4
        with:
          name: pixel-pet-mac
          path: |
            dist/*.dmg
            dist/*.zip
          if-no-files-found: error
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<'NOTES'
          ## 安装（macOS，Intel 与 Apple 芯片通用）

          1. 下载 `.dmg`（或 `.zip`），把 **Pixel Pet** 拖进“应用程序”。
          2. 应用没有苹果开发者签名，首次打开会被拦截：右键点应用选“打开”，或执行 `xattr -cr "/Applications/Pixel Pet.app"`。
          3. 先装 LobeHub CLI：`npm install -g @lobehub/cli`，宠物的大脑通过它运行。

          ## 素材说明

          “大肥鱼”的动画来自开源项目 [dsh-pet](https://github.com/PC2005-cloud/dsh-pet)：素材仅限非商业使用，形象为社区二创（非 DeepSeek 官方），授权 CC BY-NC-SA 4.0。详见 README 的 Credits。请勿商用。

          ---
          NOTES
          gh release create "${{ github.ref_name }}" dist/*.dmg dist/*.zip \
            --title "Pixel Pet ${{ github.ref_name }}" \
            --notes-file notes.md \
            --generate-notes
